        This article has 0 citations.\\n\\n---\\n\\n# Gravity hill\\n\\n> \\\"Magnetic
        hill\\\" and \\\"Mystery hill\\\" redirect here. For other uses,\\n> see [Magnetic
        Hill (disambiguation)](<https://en.wikipedia.org/wiki/Magnetic_Hill_(disambiguation)>)\\n>
        and [Mystery Hill (disambiguation)](https://en.wikipedia.org/wiki/Mystery_Hill).\\n\\nA
        **gravity hill**, also known as a\\n**magnetic hill**, **mystery hill**, **mystery
        spot**, **gravity road**, or **anti-gravity hill**,\\nis a place where the layout
        of the surrounding land produces an [illusion](https://en.wikipedia.org/wiki/Illusion),\\nmaking
        a slight downhill slope appear to be an uphill slope.\\nThus, a car left out
        of gear will appear to be rolling uphill against [gravity](https://en.wikipedia.org/wiki/Gravity).\\n\\nAlthough
        the slope of gravity hills is an illusion,\\nsites are often accompanied by
        claims that magnetic or supernatural forces are at work.\\nThe most important
        factor contributing to the illusion is a completely\\nor mostly obstructed horizon.\\nWithout
        a horizon,\\nit becomes difficult for a person to judge the slope of a surface,\\nas
        a reliable reference point is missing,\\nand misleading visual cues can adversely
        affect the sense of balance.\\nObjects which one would normally assume to be
        more or less perpendicular to the ground,\\nsuch as trees, may be leaning, offsetting
        the visual reference.\\n\\nA 2003 study looked into how the absence of a horizon
        can skew the perspective on gravity hills,\\nby recreating a number of antigravity
        places in the lab to see how volunteers would react.\\nIn conclusion, researchers
        from the Universities of Padua and Pavia in Italy\\nfound that without a true
        horizon in sight,\\nthe human brain could be tricked by common landmarks such
        as trees and signs.\\n\\nThe illusion is similar to the [Ames room](https://en.wikipedia.org/wiki/Ames_room),\\nin
        which objects can also appear to roll against gravity.\\n\\nThe opposite phenomenon\u2014an
